<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .bg { fill: #161618; stroke: none; }
    .fg { fill: #ffffff; }
    .ring { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f4f4f5; stroke: #d4d4d8; stroke-width: 0.75; }
      .fg { fill: #161618; }
      .ring { stroke: #161618; }
    }
  </style>
  <rect class="bg" x="0.4" y="0.4" width="31.2" height="31.2" rx="7"/>
  <!-- 3-zone Fresnel Zone Plate (FZP) -->
  <circle class="fg" cx="16" cy="16" r="3.8"/>
  <circle class="ring" cx="16" cy="16" r="6.75" stroke-width="1.7"/>
  <circle class="ring" cx="16" cy="16" r="10.2" stroke-width="1.4"/>
</svg>
